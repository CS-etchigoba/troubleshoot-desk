<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Troubleshoot Desk | IT Troubleshooting Assistant</title>

  <link rel="stylesheet" href="styles.css">

  <script src="cases.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <h1>Troubleshoot Desk</h1>
    <p>Find practical troubleshooting steps for common IT problems.</p>
  </header>

  <main>
    <section aria-labelledby="search-heading">
      <h2 id="search-heading">What problem are you having?</h2>

      <label for="search-input">Search troubleshooting guides</label>
      <input
        type="search"
        id="search-input"
        placeholder="Try Wi-Fi, printer, or application..."
      >

      <label for="category-filter">Category</label>
      <select id="category-filter">
        <option value="all">All categories</option>
        <option value="Hardware">Hardware</option>
        <option value="Software">Software</option>
        <option value="Networking">Networking</option>
        <option value="Licensing">Licensing</option>
      </select>
      <label for="status-filter">Resolution status</label>
      <select id="status-filter">
        <option value="all">All guides</option>
        <option value="unresolved">Unresolved</option>
        <option value="resolved">Resolved</option>
    </select>
    </section>

    <section aria-labelledby="results-heading">
      <h2 id="results-heading">Troubleshooting guides</h2>

      <p id="results-count" role="status"></p>

      <div id="cases-container">
        <!-- JavaScript will display the guides here. -->
      </div>
    </section>
  </main>

  <footer>
    <p>Created by Everlast Chigoba · Personal portfolio project</p>
    <p>Sample guides for educational purposes.</p>
  </footer>
</body>
</html>
